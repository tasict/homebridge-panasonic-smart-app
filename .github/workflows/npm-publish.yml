# See: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: Publish package to npm

on:
  release:
    types: [created]

jobs:
  # The prepublishOnly script lints and builds the project (see package.json)
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      # The release may have been published to npm manually before the GitHub
      # release was created; skip instead of failing in that case.
      - name: Check whether this version is already on npm
        id: version-check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
            echo "Version ${VERSION} is already published; skipping."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm publish
        if: steps.version-check.outputs.published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
